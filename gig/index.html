<!-- aplica o modo claro/escuro antes de desenhar a página (sem piscar) -->
<script>try{var t=localStorage.getItem("gig-tema")||"claro";if(t==="sistema")t=matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro";document.documentElement.dataset.tema=t}catch(e){}</script>

<!-- Vue e vue-router sem etapa de build: o import map resolve os nomes "vue" e
     "vue-router" para os builds ESM de navegador. -->
